    # exit-node-allow-lan-access: true # 使用 exit node 時是否允許訪問本地 LAN
    # 當目標不在 Tailscale 路由內時，連線會直接報錯，不會回退到直連；
    # 訪問公網需要配置可用的 exit-node，或接受覆蓋目標網段的 subnet routes。
    # 一個出站代理的標識。當值不為空時，將使用指定的 proxy 發出 Tailscale 控制面和 DERP/STUN 等連線
