    ipv6: 2606:4700:110:84c0:163a:4914:a0ad:3342
    mtu: 1280
    udp: true
    network: h2
    # 一個出站代理的標識。當值不為空時，將使用指定的 proxy 發出連線
    # dialer-proxy: "ss1"
    # remote-dns-resolve: true # 強制 dns 遠端解析，預設值為 false
    # dns: [ 1.1.1.1, 8.8.8.8 ] # 僅在 remote-dns-resolve 為 true 時生效
    # handshake-timeout: 30 # 單位為秒；配置後握手時不受外層連線超時影響；預設值為 0，表示僅使用外層連線超時

  # tuic
  - name: tuic
    server: www.example.com
    port: 10443
    type: tuic
    # tuicV4 必須填寫 token（不可同時填寫 uuid 和 password）
    token: TOKEN
    # tuicV5 必須填寫 uuid 和 password（不可同時填寫 token）
    uuid: 00000000-0000-0000-0000-000000000001
    password: PASSWORD_1
    # ip: 127.0.0.1 # for overwriting the DNS lookup result of the server address set in option 'server'
    # heartbeat-interval: 10000
    # alpn: [h3]
    disable-sni: true
    reduce-rtt: true
    request-timeout: 8000
    udp-relay-mode: native # Available: "native", "quic". Default: "native"
    # congestion-controller: bbr # Available: "cubic", "new_reno", "bbr". Default: "cubic"
    # cwnd: 10 # default: 32
    # bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    # max-udp-relay-packet-size: 1500
    # fast-open: true
    # skip-cert-verify: true
    # max-open-streams: 20 # default 100, too many open streams may hurt performance
    # sni: example.com
    # ech-opts:
    #   enable: true # 必須手動開啟
    #   # 如果config為空則透過dns解析，不為空則透過該值指定，格式為經過base64編碼的ech引數（dig +short TYPE65 tls-ech.dev）
    #   config: AEn+DQBFKwAgACABWIHUGj4u+PIggYXcR5JF0gYk3dCRioBW8uJq9H4mKAAIAAEAAQABAANAEnB1YmxpYy50bHMtZWNoLmRldgAA
    #   # query-server-name: xxx.com # 可選項，不為空時用於指定透過dns解析時的域名
    #
    # meta 和 sing-box 私有擴充套件，將 ss-uot 用於 udp 中繼，開啟此選項後 udp-relay-mode 將失效
    # 警告，與原版 tuic 不相容！！！
    # udp-over-stream: false
    # udp-over-stream-version: 1

  # ShadowsocksR
  # The supported ciphers (encryption methods): all stream ciphers in ss
  # The supported obfses:
  #   plain http_simple http_post
  #   random_head tls1.2_ticket_auth tls1.2_ticket_fastauth
  # The supported protocols:
  #   origin auth_sha1_v4 auth_aes128_md5
  #   auth_aes128_sha1 auth_chain_a auth_chain_b
  - name: "ssr"
    type: ssr
    server: server
    port: 443
    cipher: chacha20-ietf
    password: "password"
    obfs: tls1.2_ticket_auth
    protocol: auth_sha1_v4
    # obfs-param: domain.tld
    # protocol-param: "#"
    # udp: true

  - name: "ssh-out"
    type: ssh

    server: 127.0.0.1
    port: 22
    username: root
    password: password
    privateKey: path

  # mieru
  - name: mieru
    type: mieru
    server: 1.2.3.4
    port: 2999
    # port-range: 2090-2099 #（不可同時填寫 port 和 port-range）
    transport: TCP # 支援 TCP 或者 UDP
    udp: true # 支援 UDP over TCP
    username: user
    password: password
    # 可以使用的值包括 MULTIPLEXING_OFF, MULTIPLEXING_LOW, MULTIPLEXING_MIDDLE, MULTIPLEXING_HIGH。其中 MULTIPLEXING_OFF 會關閉多路複用功能。預設值為 MULTIPLEXING_LOW。
    # multiplexing: MULTIPLEXING_LOW
    # 如果想開啟 0-RTT 握手，請設定為 HANDSHAKE_NO_WAIT，否則請設定為 HANDSHAKE_STANDARD。預設值為 HANDSHAKE_STANDARD
    # handshake-mode: HANDSHAKE_STANDARD
    # 一個 base64 字串用於微調網路行為
    # traffic-pattern: ""

  # sudoku
  - name: sudoku
    type: sudoku
    server: server_ip/domain # 1.2.3.4 or domain
    port: 443 
    key: "<client_key>" # 如果你使用sudoku生成的ED25519金鑰對，請填寫金鑰對中的私鑰，否則填入和服務端相同的uuid
    aead-method: chacha20-poly1305 # 可選：chacha20-poly1305、aes-128-gcm、none（不建議；none 不提供 AEAD 保護）
    padding-min: 2 # 最小填充率（0-100）
    padding-max: 7 # 最大填充率（0-100，必須 >= padding-min）
    table-type: prefer_ascii    # 可選值：prefer_ascii、prefer_entropy、up_ascii_down_entropy、up_entropy_down_ascii
    # custom-table: xpxvvpvv    # 可選，自定義位元組佈局，必須包含2個x、2個p、4個v，可隨意組合；只對 entropy 方向生效
    # custom-tables: ["xpxvvpvv", "vxpvxvvp"] # 可選，自定義位元組佈局列表（x/v/p），非空時覆蓋 custom-table
    # 推薦：使用 httpmask 物件統一管理 HTTPMask 相關欄位：
    httpmask:
      disable: false # true 禁用所有 HTTP 偽裝/隧道
      mode: legacy # 可選：legacy（預設）、stream（split-stream）、poll、auto（先 stream 再 poll）、ws（WebSocket 隧道）
      # tls: true # 可選：按需開啟 HTTPS/WSS
      # host: "" # 可選：覆蓋 Host/SNI（支援 example.com 或 example.com:443）；僅在 mode 為 stream/poll/auto/ws 時生效
      # path-root: "" # 可選：HTTP 隧道端點一級路徑字首（雙方需一致），例如 "aabbcc" 或 "/aabbcc/" => /aabbcc/session、/aabbcc/stream、/aabbcc/api/v1/upload、/aabbcc/ws
      # multiplex: "off" # 可選字串：off（預設）、auto（複用底層 HTTP 連線，減少建鏈 RTT）、on（Sudoku mux 單隧道多目標；僅在 mode=stream/poll/auto 生效；ws 強制 off）
    enable-pure-downlink: false # 可選：false=頻寬最佳化下行；true=純 Sudoku 下行

  # anytls
  - name: anytls
    type: anytls
    server: 1.2.3.4
    port: 443
    password: "<your password>"
    # client-fingerprint: chrome
    udp: true
    # idle-session-check-interval: 30 # seconds
    # idle-session-timeout: 30 # seconds
    # min-idle-session: 0
    # sni: "example.com"
    # alpn:
    #   - h2
    #   - http/1.1
    # skip-cert-verify: true

  # trusttunnel
  - name: trusttunnel
    type: trusttunnel
    server: 1.2.3.4
    port: 443
    username: username
    password: password
    # client-fingerprint: chrome
    health-check: true
    udp: true
    # sni: "example.com"
    # alpn:
    #   - h2
    # skip-cert-verify: true
    ### quic options
    # quic: true # 預設為false
    # congestion-controller: bbr
    # bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    ### reuse options
    # max-connections: 8 # Maximum connections. Conflict with max-streams.
    # min-streams: 5 # Minimum multiplexed streams in a connection before opening a new connection. Conflict with max-streams.
    # max-streams: 0 # Maximum multiplexed streams in a connection before opening a new connection. Conflict with max-connections and min-streams.

# dns 出站會將請求劫持到內部 dns 模組，所有請求均在內部處理
  - name: "dns-out"
    type: dns

  - name: "rematch"
    type: rematch
    target-rematch-name: "rematch1" # 如果填寫則覆蓋原始 metadata 中的 rematch-name（可用REMATCH-NAME規則匹配）
    target-sub-rule: "sub-rule1" # 如果填寫則接下來會直接用指定的 sub-rule 匹配，如果名字不存在或為空會回退到主rules

  # 配置指定 interface-name 和 fwmark 的 DIRECT
  - name: en1-direct
    type: direct
    interface-name: en1
    routing-mark: 6667
proxy-groups:
  # url-test 將按照 url 測試結果使用延遲最低節點
  - name: "auto"
    type: url-test
    proxies:
      - ss1
      - ss2
      - vmess1
    # tolerance: 150
    # lazy: true
    # expected-status: 204 # 當健康檢查返回狀態碼與期望值不符時，認為節點不可用
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # fallback 將按照 url 測試結果按照節點順序選擇
  - name: "fallback-auto"
    type: fallback
    proxies:
      - ss1
      - ss2
      - vmess1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # load-balance 將按照演算法隨機選擇節點
  - name: "load-balance"
    type: load-balance
    proxies:
      - ss1
      - ss2
      - vmess1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
  # strategy: consistent-hashing # 可選 round-robin 和 sticky-sessions

  # select 使用者自行選擇節點
  - name: Proxy
    type: select
    # disable-udp: true
    proxies:
      - ss1
      - ss2
      - vmess1
      - auto
    # default-selected: ss1 # 預設選擇的節點（該項為空或者設定的節點名不存在時，預設選擇組中第一個節點）

  - name: UseProvider
    type: select
    filter: "HK|TW" # 正規表示式，過濾 provider1 中節點名包含 HK 或 TW
    use:
      - provider1
    proxies:
      - Proxy
      - DIRECT
    # empty-fallback: COMPATIBLE # 設定當組為空時的回退proxy（這裡不支援填寫代理組，只支援填寫proxy名稱）

# Mihomo 格式的節點或支援 *ray 的分享格式
proxy-providers:
  provider1:
    type: http # http 的 path 可空置，預設儲存路徑為 homedir 的 proxies 資料夾，檔名為 url 的 md5
    url: "url"
    interval: 3600
    path: ./provider1.yaml # 預設只允許儲存在 mihomo 的 Home Dir，如果想儲存到其他位置，請透過設定 SAFE_PATHS 環境變數指定額外的安全路徑。該環境變數的語法同本作業系統的PATH環境變數解析規則（即Windows下以分號分割，其他系統下以冒號分割）
    proxy: DIRECT
    # size-limit: 10240 # 限制下載檔案最大為10kb，預設為0即不限制檔案大小
    # #
    # # 如果設定會age-secret-key嘗試透過此secret解密age armor格式加密的配置檔案
    # #
    # # 注意：
    # #   對於加密內容，目前僅支援 age-encryption.org/v1 的 official ASCII "armor" format
    # #   對於key格式，目前僅支援 age-encryption.org/v1 的 x25519 recipient type 和 The mlkem768-x25519 hybrid post-quantum recipient type
    # # 實用工具：
    # #   您可以透過 "mihomo age keygen" 生成符合要求的 x25519 key
    # #   您可以透過 "mihomo age keygen-pq" 生成符合要求的 mlkem768-x25519 key
    # #   您可以透過 "mihomo age convert <secret_key>" 從 age-secret-key 匯出 age-public-key
    # #   您可以透過 "mihomo age decrypt <secret_key> <source_file> <target_file>" 將已加密檔案解密，<source_file> 為 - 時會從標準輸入讀取，<target_file> 為 - 時會往標準輸出寫入
    # #   您可以透過 "mihomo age encrypt <public_key> <source_file> <target_file>" 將未加密檔案加密，<source_file> 為 - 時會從標準輸入讀取，<target_file> 為 - 時會往標準輸出寫入
    # # 參考實現：
    # #   https://github.com/FiloSottile/awesome-age#implementations
    # #
    # age-secret-key: AGE-SECRET-KEY-1ZTQLLN0A4U3ZTT3DCZKYN0CGZEZQLWX2DFTXUWMT4ZHR0N2UG6LSW9NT0N
    header:
      User-Agent:
      - "Clash/v1.18.0"
      - "mihomo/1.18.3"
      # Accept:
      # - 'application/vnd.github.v3.raw'
      # Authorization:
      # - 'token 1231231'
      # X-Age-Public-Key:
      # - 'age1xh86kh9v23vattr58yedspm3f57sxvnswu9krr6ns438amekx5gsd09uma'
    health-check:
      enable: true
      interval: 600
      # lazy: true
      url: https://cp.cloudflare.com/generate_204
      # expected-status: 204 # 當健康檢查返回狀態碼與期望值不符時，認為節點不可用
    override: # 覆寫節點載入時的一些配置項
      skip-cert-verify: true
      udp: true
      # down: "50 Mbps"
      # up: "10 Mbps"
      # dialer-proxy: proxy
      # interface-name: tailscale0
      # routing-mark: 233
      # ip-version: ipv4-prefer
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
      # # 名字替換，支援正規表示式
      # proxy-name:
      #   - pattern: "test"
      #     target: "TEST"
      #   - pattern: "IPLC-(.*?)倍"
      #     target: "iplc x $1"

  provider2:
    type: inline
    dialer-proxy: proxy
    payload:
      - name: "ss1"
        type: ss
        server: server
        port: 443
        cipher: chacha20-ietf-poly1305
        password: "password"

  test:
    type: file
    path: /test.yaml
    health-check:
      enable: true
      interval: 36000
      url: https://cp.cloudflare.com/generate_204
rule-providers:
  rule1:
    behavior: classical # domain ipcidr
    interval: 259200
    path: /path/to/save/file.yaml # 預設只允許儲存在 mihomo 的 Home Dir，如果想儲存到其他位置，請透過設定 SAFE_PATHS 環境變數指定額外的安全路徑。該環境變數的語法同本作業系統的PATH環境變數解析規則（即Windows下以分號分割，其他系統下以冒號分割）
    type: http # http 的 path 可空置，預設儲存路徑為 homedir 的 rules 資料夾，檔名為 url 的 md5
    url: "url"
    proxy: DIRECT
    # size-limit: 10240 # 限制下載檔案最大為10kb，預設為0即不限制檔案大小
  rule2:
    behavior: classical
    interval: 259200
    path: /path/to/save/file.yaml
    type: file
  rule3:
    # mrs型別ruleset，目前僅支援domain和ipcidr(即不支援classical），
    #
    # 對於behavior=domain:
    #  - format=yaml 可以透過“mihomo convert-ruleset domain yaml XXX.yaml XXX.mrs”轉換到mrs格式
    #  - format=text 可以透過“mihomo convert-ruleset domain text XXX.text XXX.mrs”轉換到mrs格式
    #  - XXX.mrs 可以透過"mihomo convert-ruleset domain mrs XXX.mrs XXX.text"轉換回text格式（暫不支援轉換回yaml格式）
    #
    # 對於behavior=ipcidr:
    #  - format=yaml 可以透過“mihomo convert-ruleset ipcidr yaml XXX.yaml XXX.mrs”轉換到mrs格式
    #  - format=text 可以透過“mihomo convert-ruleset ipcidr text XXX.text XXX.mrs”轉換到mrs格式
    #  - XXX.mrs 可以透過"mihomo convert-ruleset ipcidr mrs XXX.mrs XXX.text"轉換回text格式（暫不支援轉換回yaml格式）
    #
    type: http
    url: "url"
    format: mrs
    behavior: domain
    path: /path/to/save/file.mrs
    # path-in-bundle: "geo/geosite/cn.mrs" # 當設定該選項時，如果本地檔案不存在，會優先從 Home Dir的 BundleMRS.7z 中解壓該檔案，此項的值用於指定在 BundleMRS.7z 中的路徑
  rule4:
    type: inline
    behavior: domain # classical / ipcidr
    payload:
      - '.blogger.com'
      - '*.*.microsoft.com'
      - 'books.itunes.apple.com'

rules:
  - RULE-SET,rule1,REJECT
  - IP-ASN,1,PROXY
  - DOMAIN-REGEX,^abc,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-KEYWORD,google,ss1
  - DOMAIN-WILDCARD,test.*.mihomo.com,ss1
  - IP-CIDR,1.1.1.1/32,ss1
  - IP-CIDR6,2409::/64,DIRECT
  # 當滿足條件是 TCP 或 UDP 流量時，使用名為 sub-rule-name1 的規則集
  - SUB-RULE,(OR,((NETWORK,TCP),(NETWORK,UDP))),sub-rule-name1
  - SUB-RULE,(AND,((NETWORK,UDP))),sub-rule-name2
# 定義多個子規則集，規則將以分叉匹配，使用 SUB-RULE 使用
#                                               google.com(not match)--> baidu.com(match)
#                                                /                                ｜
#                                               /                                 ｜
#  https://baidu.com  --> rule1 --> rule2 --> sub-rule-name1(match tcp)          使用 DIRECT
#
#
#                                              google.com(not match)--> baidu.com(not match)
#                                                /                            ｜
#                                               /                             ｜
#  dns 1.1.1.1  --> rule1 --> rule2 --> sub-rule-name1(match udp)         sub-rule-name2(match udp)
#                                                                             ｜
#                                                                             ｜
#                                                                 使用 REJECT <-- 1.1.1.1/32(match)
#

sub-rules:
  sub-rule-name1:
    - DOMAIN,google.com,ss1
    - DOMAIN,baidu.com,DIRECT
  sub-rule-name2:
    - IP-CIDR,1.1.1.1/32,REJECT
    - IP-CIDR,8.8.8.8/32,ss1
    - DOMAIN,dns.alidns.com,REJECT

# 流量入站
listeners:
  - name: socks5-in-1
    type: socks
    port: 10808 # 支援使用ports格式，例如200,302 or 200,204,401-429,501-503
    #listen: 0.0.0.0 # 預設監聽 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    # rule: sub-rule-name1 # 預設使用 rules，如果未找到 sub-rule 則直接使用 rules
    # proxy: proxy # 如果不為空則直接將該入站流量交由指定 proxy 處理
    # udp: false # 預設 true
    # users: # 如果不填寫users項，則遵從全域性authentication設定，如果填寫會忽略全域性設定, 如想跳過該入站的驗證可填寫 users: []
    #   - username: aaa
    #     password: aaa
    # 下面兩項如果填寫則開啟 tls（需要同時填寫）
    # certificate: ./server.crt # 證書 PEM 格式，或者 證書的路徑
    # private-key: ./server.key # 證書對應的私鑰 PEM 格式，或者私鑰路徑
    # 下面兩項為mTLS配置項，如果client-auth-type設定為 "verify-if-given" 或 "require-and-verify" 則client-auth-cert必須不為空
    # client-auth-type: "" # 可選值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    # client-auth-cert: string # 證書 PEM 格式，或者 證書的路徑
    # 如果填寫則開啟ech（可由 mihomo generate ech-keypair <明文域名> 生成）
    # ech-key: |
    #   -----BEGIN ECH KEYS-----
    #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #   dC5jb20AAA==
    #   -----END ECH KEYS-----

  - name: http-in-1
    type: http
    port: 10809 # 支援使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    # rule: sub-rule-name1 # 預設使用 rules，如果未找到 sub-rule 則直接使用 rules
    # proxy: proxy # 如果不為空則直接將該入站流量交由指定 proxy 處理 (當 proxy 不為空時，這裡的 proxy 名稱必須合法，否則會出錯)
    # users: # 如果不填寫users項，則遵從全域性authentication設定，如果填寫會忽略全域性設定, 如想跳過該入站的驗證可填寫 users: []
    #   - username: aaa
    #     password: aaa
    # 下面兩項如果填寫則開啟 tls（需要同時填寫）
