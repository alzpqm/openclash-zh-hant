# Meta配置模板：https://github.com/MetaCubeX/mihomo/blob/Alpha/docs/config.yaml
# 接管：部分引數不支援在此頁面直接修改，請到覆寫設定頁面進行修改

# port: 7890 # HTTP(S) 代理伺服器埠
# socks-port: 7891 # SOCKS5 代理埠
mixed-port: 10801 # HTTP(S) 和 SOCKS 代理混合埠
# redir-port: 7892 # 透明代理埠，用於 Linux 和 MacOS

# Transparent proxy server port for Linux (TProxy TCP and TProxy UDP)
# tproxy-port: 7893

allow-lan: true # 允許區域網連線
bind-address: "*" # 繫結 IP 地址，僅作用於 allow-lan 為 true，'*'表示所有地址
authentication: # http,socks 入口的驗證使用者名稱，密碼
  - "username:password"
skip-auth-prefixes: # 設定跳過驗證的 IP 段
  - 127.0.0.1/8
  - ::1/128
lan-allowed-ips: # 允許連線的 IP 地址段，僅作用於 allow-lan 為 true, 預設值為 0.0.0.0/0 和::/0
  - 0.0.0.0/0
  - ::/0
lan-disallowed-ips: # 禁止連線的 IP 地址段，黑名單優先順序高於白名單，預設值為空
  - 192.168.0.3/32

#  find-process-mode has 3 values:always, strict, off
#  - always, 開啟，強制匹配所有程序
#  - strict, 預設，由 mihomo 判斷是否開啟
#  - off, 不匹配程序，推薦在路由器上使用此模式
find-process-mode: strict

mode: rule

#自定義 geodata url
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"

geo-auto-update: false # 是否自動更新 geodata
geo-update-interval: 24 # 更新間隔，單位：小時

# Matcher implementation used by GeoSite, available implementations:
# - succinct (default, same as rule-set)
# - mph (from V2Ray, also `hybrid` in Xray)
# geosite-matcher: succinct

log-level: debug # 日誌等級 silent/error/warning/info/debug

ipv6: true # 開啟 IPv6 總開關，關閉阻斷所有 IPv6 連結和遮蔽 DNS 請求 AAAA 記錄

tls:
  certificate: string # 證書 PEM 格式，或者 證書的路徑
  private-key: string # 證書對應的私鑰 PEM 格式，或者私鑰路徑
  # 下面兩項為mTLS配置項，如果client-auth-type設定為 "verify-if-given" 或 "require-and-verify" 則client-auth-cert必須不為空
  # client-auth-type: "" # 可選值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
  # client-auth-cert: string # 證書 PEM 格式，或者 證書的路徑
  # 如果填寫則開啟ech（可由 mihomo generate ech-keypair <明文域名> 生成）
  # ech-key: |
  #   -----BEGIN ECH KEYS-----
  #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
  #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
  #   dC5jb20AAA==
  #   -----END ECH KEYS-----
  custom-certifactes:
    - |
      -----BEGIN CERTIFICATE-----
      format/pem...
      -----END CERTIFICATE-----

external-controller: 0.0.0.0:9093 # RESTful API 監聽地址
external-controller-tls: 0.0.0.0:9443 # RESTful API HTTPS 監聽地址，需要配置 tls 部分配置檔案
# secret: "123456" # `Authorization:Bearer ${secret}`

# RESTful API CORS標頭配置
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

# RESTful API Unix socket 監聽地址（ windows版本大於17063也可以使用，即大於等於1803/RS4版本即可使用 ）
# ！！！注意： 從Unix socket訪問api介面不會驗證secret， 如果開啟請自行保證安全問題 ！！！
# 測試方法： curl -v --unix-socket "mihomo.sock" http://localhost/
external-controller-unix: mihomo.sock

# RESTful API Windows namedpipe 監聽地址
# ！！！注意： 從Windows namedpipe訪問api介面不會驗證secret， 如果開啟請自行保證安全問題 ！！！
external-controller-pipe: \\.\pipe\mihomo

# 為 external-controller 和 external-controller-tls 的監聽socket設定routing-mark（僅支援linux）
external-controller-routing-mark: 0

# tcp-concurrent: true # TCP 併發連線所有 IP, 將使用最快握手的 TCP

# 配置 WEB UI 目錄，使用 http://{{external-controller}}/ui 訪問
external-ui: /path/to/ui/folder/
external-ui-name: xd
# 目前支援下載zip,tgz格式的壓縮包
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# 在RESTful API埠上開啟DOH伺服器
# ！！！該URL不會驗證secret， 如果開啟請自行保證安全問題 ！！！
external-doh-server: /dns-query

# interface-name: en0 # 設定出口網絡卡

#  TCP keep alive interval
# disable-keep-alive: false #目前在android端強制為true
# keep-alive-idle: 15
# keep-alive-interval: 15

# routing-mark:6666 # 配置 fwmark 僅用於 Linux
experimental:
  # Disable quic-go GSO support. This may result in reduced performance on Linux.
  # This is not recommended for most users.
  # Only users encountering issues with quic-go's internal implementation should enable this,
  # and they should disable it as soon as the issue is resolved.
  # This field will be removed when quic-go fixes all their issues in GSO.
  # This equivalent to the environment variable QUIC_GO_DISABLE_GSO=1.
  #quic-go-disable-gso: true

# 類似於 /etc/hosts, 僅支援配置單個 IP
hosts:
# '*.mihomo.dev': 127.0.0.1
# '.dev': 127.0.0.1
# 'alpha.mihomo.dev': '::1'
# test.com: [1.1.1.1, 2.2.2.2]
# home.lan: lan # lan 為特別欄位，將加入本地所有網絡卡的地址
# baidu.com: google.com # 只允許配置一個別名

profile: # 儲存 select 選擇記錄
  store-selected: false

  # 持久化 fake-ip
  store-fake-ip: true

# Tun 配置
tun:
  enable: false
  stack: system # gvisor/mixed
  dns-hijack:
    - 0.0.0.0:53 # 需要劫持的 DNS
  # auto-detect-interface: true # 自動識別出口網絡卡
  # auto-route: true # 配置路由表
  # mtu: 9000 # 最大傳輸單元
  # gso: false # 啟用通用分段解除安裝，僅支援 Linux
  # gso-max-size: 65536 # 通用分段解除安裝包的最大大小
  auto-redirect: false # 自動配置 iptables 以重定向 TCP 連線。僅支援 Linux。帶有 auto-redirect 的 auto-route 現在可以在路由器上按預期工作，無需干預。
  # strict-route: true # 將所有連線路由到 tun 來防止洩漏，但你的裝置將無法其他裝置被訪問
  # disable-icmp-forwarding: true # 禁用 ICMP 轉發，防止某些情況下的 ICMP 環回問題，ping 將不會顯示真實的延遲
  route-address-set: # 將指定規則集中的目標 IP CIDR 規則新增到防火牆, 不匹配的流量將繞過路由, 僅支援 Linux，且需要 nftables，`auto-route` 和 `auto-redirect` 已啟用。
    - ruleset-1
    - ruleset-2
  route-exclude-address-set: # 將指定規則集中的目標 IP CIDR 規則新增到防火牆, 匹配的流量將繞過路由, 僅支援 Linux，且需要 nftables，`auto-route` 和 `auto-redirect` 已啟用。
    - ruleset-3
    - ruleset-4
  route-address: # 啟用 auto-route 時使用自定義路由而不是預設路由
    - 0.0.0.0/1
    - 128.0.0.0/1
    - "::/1"
    - "8000::/1"
  # inet4-route-address: # 啟用 auto-route 時使用自定義路由而不是預設路由（舊寫法）
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1
  # inet6-route-address: # 啟用 auto-route 時使用自定義路由而不是預設路由（舊寫法）
  #   - "::/1"
  #   - "8000::/1"
  # endpoint-independent-nat: false # 啟用獨立於端點的 NAT
  # include-interface: # 限制被路由的介面。預設不限制，與 `exclude-interface` 衝突
  #   - "lan0"
  # exclude-interface: # 排除路由的介面，與 `include-interface` 衝突
  #   - "lan1"
  # include-uid: # UID 規則僅在 Linux 下被支援，並且需要 auto-route
  # - 0
  # include-uid-range: # 限制被路由的的使用者範圍
  # - 1000:9999
  # exclude-uid: # 排除路由的的使用者
  #- 1000
  # exclude-uid-range: # 排除路由的的使用者範圍
  # - 1000:9999
  # include-mac-address:
  # - 00:11:22:33:44:55
  # exclude-mac-address:
  # - 00:11:22:33:44:55

  # Android 使用者和應用規則僅在 Android 下被支援
  # 並且需要 auto-route

  # include-android-user: # 限制被路由的 Android 使用者
  # - 0
  # - 10
  # include-package: # 限制被路由的 Android 應用包名
  # - com.android.chrome
  # exclude-package: # 排除被路由的 Android 應用包名
  # - com.android.captiveportallogin

# 嗅探域名 可選配置
sniffer:
  enable: false
  ## 對 redir-host 型別識別的流量進行強制嗅探
  ## 如：Tun、Redir 和 TProxy 並 DNS 為 redir-host 皆屬於
  # force-dns-mapping: false
  ## 對所有未獲取到域名的流量進行強制嗅探
  # parse-pure-ip: false
  # 是否使用嗅探結果作為實際訪問，預設 true
  # 全域性配置，優先順序低於 sniffer.sniff 實際配置
  override-destination: false
  sniff: # TLS 和 QUIC 預設如果不配置 ports 預設嗅探 443
    QUIC:
    #  ports: [ 443 ]
    TLS:
    #  ports: [443, 8443]

    # 預設嗅探 80
    HTTP: # 需要嗅探的埠
      ports: [80, 8080-8880]
      # 可覆蓋 sniffer.override-destination
      override-destination: true
  force-domain:
    - +.v2ex.com
  # skip-src-address: # 對於來源ip跳過嗅探
  #   - 192.168.0.3/32
  # skip-dst-address: # 對於目標ip跳過嗅探
  #   - 192.168.0.3/32
  ## 對嗅探結果進行跳過
  # skip-domain:
  #   - Mijia Cloud
  # 需要嗅探協議
  # 已廢棄，若 sniffer.sniff 配置則此項無效
  sniffing:
    - tls
    - http
  # 強制對此域名進行嗅探

  # 僅對白名單中的埠進行嗅探，預設為 443，80
  # 已廢棄，若 sniffer.sniff 配置則此項無效
  port-whitelist:
    - "80"
    - "443"
    # - 8000-9999

tunnels: # one line config
  - tcp/udp,127.0.0.1:6553,114.114.114.114:53,proxy
  - tcp,127.0.0.1:6666,rds.mysql.com:3306,vpn
  # full yaml config
  - network: [tcp, udp]
    address: 127.0.0.1:7777
    target: target.com
    proxy: proxy

# DNS 配置
dns:
  cache-algorithm: arc
  enable: false # 關閉將使用系統 DNS
  prefer-h3: false # 是否開啟 DoH 支援 HTTP/3，將併發嘗試
  listen: 0.0.0.0:53 # 開啟 DNS 伺服器監聽
  # ipv6: false # false 將返回 AAAA 的空結果
  # ipv6-timeout: 300 # 單位：ms，內部雙棧併發時，向上遊查詢 AAAA 時，等待 AAAA 的時間，預設 100ms
  # 用於解析 nameserver，fallback 以及其他 DNS 伺服器配置的，DNS 服務域名
  # 只能使用純 IP 地址，可使用加密 DNS
  default-nameserver:
    - 114.114.114.114
    - 8.8.8.8
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
    - system # append DNS server from system configuration. If not found, it would print an error log and skip.
  enhanced-mode: fake-ip # or redir-host

  fake-ip-range: 198.18.0.1/16 # fake-ip 池設定
  # fake-ip-range6: fdfe:dcba:9876::1/64 # fake-ip6 池設定

  # 配置不使用 fake-ip 的域名
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    # fakeip-filter 為 rule-providers 中的名為 fakeip-filter 規則訂閱，
    # 且 behavior 必須為 domain/classical，當為 classical 時僅會生效域名類規則
    - rule-set:fakeip-filter
    # fakeip-filter 為 geosite 中名為 fakeip-filter 的分類（需要自行保證該分類存在）
    - geosite:fakeip-filter

    # 當 fake-ip-filter-mode: rule 時開啟規則模式
    # fake-ip 與路由 rules 匹配邏輯一致(自上而下)，語法也一致，支援GEOSITE、RuleSet、DOMAIN*、MATCH
    - RULE-SET,reject-domain,fake-ip # 自定義 RuleSet behavior 必須為 domain/classical，當為 classical 時僅會生效域名類規則
    - RULE-SET,proxy-domain,fake-ip
    - GEOSITE,gfw,fake-ip
    - DOMAIN,www.baidu.com,real-ip
    - DOMAIN-SUFFIX,qq.com,real-ip
    - DOMAIN-SUFFIX,jd.com,fake-ip
    - MATCH,fake-ip # 最後 fake-ip or real-ip

  # 配置fake-ip-filter的匹配模式，預設為blacklist，即如果匹配成功不返回fake-ip
  # 可設定為whitelist，即只有匹配成功才返回fake-ip
  # 也可配置為rule，規則模式語法見fake-ip-filter說明
  fake-ip-filter-mode: blacklist
  # 配置fakeip查詢返回的TTL，非必要情況下請勿修改
  fake-ip-ttl: 1

  # use-hosts: true # 查詢 hosts

  # 配置後面的nameserver、fallback和nameserver-policy向dns伺服器的連線過程是否遵守遵守rules規則
  # 如果為false（預設值）則這三部分的dns伺服器在未特別指定的情況下會直連
  # 如果為true，將會按照rules的規則匹配連結方式（走代理或直連），如果有特別指定則任然以指定值為準
  # 僅當proxy-server-nameserver非空時可以開啟此選項, 強烈不建議和prefer-h3一起使用
  # 此外，這三者配置中的dns伺服器如果出現域名會採用default-nameserver配置項解析，也請確保正確配置default-nameserver
  respect-rules: false

  # DNS 主要域名配置
  # 支援 UDP，TCP，DoT，DoH，DoQ
  # 這部分為主要 DNS 配置，影響所有直連，確保使用對大陸解析精準的 DNS
  nameserver:
    - 114.114.114.114 # default value
    - 8.8.8.8 # default value
    - tls://223.5.5.5:853 # DNS over TLS
    - https://doh.pub/dns-query # DNS over HTTPS
    - https://dns.alidns.com/dns-query#h3=true # 強制 HTTP/3，與 perfer-h3 無關，強制開啟 DoH 的 HTTP/3 支援，若不支援將無法使用
    - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true # 指定策略組和使用 HTTP/3
    - dhcp://en0 # dns from dhcp
    - quic://dns.adguard.com:784 # DNS over QUIC
    # - ts://tailscale # 使用指定 Tailscale 出站的 DNS 配置查詢
    # - '8.8.8.8#RULES' # 效果同respect-rules，但僅對該伺服器生效
    # - '8.8.8.8#en0' # 相容指定 DNS 出口網絡卡

  # 當配置 fallback 時，會查詢 nameserver 中返回的 IP 是否為 CN，非必要配置
  # 當不是 CN，則使用 fallback 中的 DNS 查詢結果
  # 確保配置 fallback 時能夠正常查詢
  # fallback:
  #   - tcp://1.1.1.1
  #   - 'tcp://1.1.1.1#ProxyGroupName' # 指定 DNS 過代理查詢，ProxyGroupName 為策略組名或節點名，過代理配置優先於配置出口網絡卡，當找不到策略組或節點名則設定為出口網絡卡

  # 專用於節點域名解析的 DNS 伺服器，非必要配置項，如果不填則遵循nameserver-policy、nameserver和fallback的配置
  # proxy-server-nameserver:
  #   - https://doh.pub/dns-query
  #   - tls://223.5.5.5:853
  # proxy-server-nameserver-policy: # 格式同nameserver-policy，僅用於節點域名解析，當且僅當proxy-server-nameserver不為空時生效
  #   'www.yournode.com': '114.114.114.114'

  # 專用於direct出口域名解析的 DNS 伺服器，非必要配置項，如果不填則遵循nameserver-policy、nameserver和fallback的配置
  # direct-nameserver:
  #   - system://
  # direct-nameserver-follow-policy: false # 是否遵循nameserver-policy，預設為不遵守，僅當direct-nameserver不為空時生效

  # 配置 fallback 使用條件
  # fallback-filter:
  #   geoip: true    # 配置是否使用 geoip
  #   geoip-code: CN # 當 nameserver 解析出域名的 IP 查詢 geoip 庫為 CN 時， 使用 nameserver 中的 DNS 查詢結果
  #   ipcidr:        # 當 nameserver 解析出域名的 IP 匹配 ipcidr 時，使用 fallback 中的 DNS 查詢結果
  #     - 240.0.0.0/4
  #     - 0.0.0.0/32
  #     - 127.0.0.1/32
  #     - 100.64.0.0/10
  #   domain:        # 匹配到這些域名，會直接使用 fallback 解析，不去使用 nameserver
  #     - '+.google.com'
  #     - '+.facebook.com'
  #     - '+.youtube.com'
  #   geosite:       # 匹配到這些域名，會直接使用 fallback 解析，不去使用 nameserver（已廢棄，請使用 nameserver-policy）
  #     - gfw
  # fallback-lazy-query: false # 預設值為 false ，如果為 true 會先判斷來自 nameserver 的結果是否滿足 fallback-filter 後再發起查詢

  # 配置查詢域名使用的 DNS 伺服器
  nameserver-policy:
    #   'www.baidu.com': '114.114.114.114'
    #   '+.internal.crop.com': '10.0.0.1'
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:category-ads-all": rcode://success
    "www.baidu.com,+.google.cn": [223.5.5.5, https://dns.alidns.com/dns-query]
    ## global，dns 為 rule-providers 中的名為 global 和 dns 規則訂閱，
    ## 且 behavior 必須為 domain/classical，當為 classical 時僅會生效域名類規則
    # "rule-set:global,dns": 8.8.8.8

proxies: # socks5
  - name: "socks"
    type: socks5
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true
    # fingerprint: xxxx # 配置指紋將實現 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 獲取
    # 下面兩項如果填寫則開啟 mTLS（需要同時填寫）
    # certificate: ./client.crt # 證書 PEM 格式，或者 證書的路徑
    # private-key: ./client.key # 證書對應的私鑰 PEM 格式，或者私鑰路徑
    # skip-cert-verify: true
    # udp: true
    # ip-version: ipv6

  # http
  - name: "http"
    type: http
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true # https
    # skip-cert-verify: true
    # sni: custom.com
    # fingerprint: xxxx # 配置指紋將實現 SSL Pining 效果, 可使用 openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem 獲取
    # 下面兩項如果填寫則開啟 mTLS（需要同時填寫）
    # certificate: ./client.crt # 證書 PEM 格式，或者 證書的路徑
    # private-key: ./client.key # 證書對應的私鑰 PEM 格式，或者私鑰路徑
    # ip-version: dual

  # Snell
  - name: "snell"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 4 # support 1/2/3/4/5
    # udp: true # support UDP on version 3/4/5
    # reuse: false # v4/5 only
    # obfs-opts:
    #   mode: http # or tls/shadow-tls

  - name: "snell-shadow-tls"
    type: snell
    server: server
