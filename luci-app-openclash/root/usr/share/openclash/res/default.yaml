  - name: vless-in-1
    type: vless
    port: 10817 # 支援使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    # rule: sub-rule-name1 # 預設使用 rules，如果未找到 sub-rule 則直接使用 rules
    # proxy: proxy # 如果不為空則直接將該入站流量交由指定 proxy 處理 (當 proxy 不為空時，這裡的 proxy 名稱必須合法，否則會出錯)
    users:
      - username: 1
        uuid: 9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68
        flow: xtls-rprx-vision
    # ws-path: "/" # 如果不為空則開啟 websocket 傳輸層
    # grpc-service-name: "GunService" # 如果不為空則開啟 grpc 傳輸層
    # xhttp-config: # 如果不為空則開啟 xhttp 傳輸層
    #   path: "/"
    #   host: ""
    #   mode: auto # Available: "stream-one", "stream-up" or "packet-up"
    #   no-sse-header: false
    #   x-padding-bytes: "100-1000"
    #   x-padding-obfs-mode: false
    #   x-padding-key: x_padding
    #   x-padding-header: Referer
    #   x-padding-placement: queryInHeader # Available: queryInHeader, cookie, header, query
    #   x-padding-method: repeat-x # Available: repeat-x, tokenish
    #   uplink-http-method: POST # Available: POST, PUT, PATCH, DELETE
    #   session-placement: path # Available: path, query, cookie, header
    #   session-key: ""
    #   session-table: "" # Available: "", "uuid", "ALPHABET", "Alphabet", "BASE36", "Base62", "HEX", "alphabet", "base36", "hex", "number"
    #   session-length: "16-32" # 起始值不可為 0，總的 id 空間必須大於 21 億，僅當session-table不為空或uuid時生效
    #   seq-placement: path # Available: path, query, cookie, header
    #   seq-key: ""
    #   uplink-data-placement: body # Available: body, cookie, header
    #   uplink-data-key: ""
    #   uplink-chunk-size: 0 # only applicable when uplink-data-placement is not body
    #   sc-max-buffered-posts: 30
    #   sc-stream-up-server-secs: "20-80"
    #   sc-max-each-post-bytes: 1000000
    # -------------------------
    # vless encryption服務端配置：
    # （原生外觀 / 只 XOR 公鑰 / 全隨機數。1-RTT 每次下發隨機 300 到 600 秒的 ticket 以便 0-RTT 複用 / 只允許 1-RTT）
    # 填寫 "600s" 會每次隨機取 50% 到 100%，即相當於填寫 "300-600s"
    # / 是隻能選一個，後面 base64 至少一個，無限串聯，使用 mihomo generate vless-x25519 和 mihomo generate vless-mlkem768 生成，替換值時需去掉括號
    #
    # Padding 是可選的引數，僅作用於 1-RTT 以消除握手的長度特徵，雙端預設值均為 "100-111-1111.75-0-111.50-0-3333"：
    # 在 1-RTT client/server hello 後以 100% 的機率粘上隨機 111 到 1111 位元組的 padding
    # 以 75% 的機率等待隨機 0 到 111 毫秒（"probability-from-to"）
    # 再次以 50% 的機率傳送隨機 0 到 3333 位元組的 padding（若為 0 則不 Write()）
    # 服務端、客戶端可以設定不同的 padding 引數，按 len、gap 的順序無限串聯，第一個 padding 需機率 100%、至少 35 位元組
    # -------------------------
    # decryption: "mlkem768x25519plus.native/xorpub/random.600s(300-600s)/0s.(padding len).(padding gap).(X25519 PrivateKey).(ML-KEM-768 Seed)..."
    # 下面兩項如果填寫則開啟 tls（需要同時填寫）
    # certificate: ./server.crt # 證書 PEM 格式，或者 證書的路徑
    # private-key: ./server.key # 證書對應的私鑰 PEM 格式，或者私鑰路徑
    # 下面兩項為mTLS配置項，如果client-auth-type設定為 "verify-if-given" 或 "require-and-verify" 則client-auth-cert必須不為空
    # client-auth-type: "" # 可選值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    # client-auth-cert: string # 證書 PEM 格式，或者 證書的路徑
    # 如果填寫則開啟ech（可由 mihomo generate ech-keypair <明文域名> 生成）
    # ech-key: |
    #   -----BEGIN ECH KEYS-----
    #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #   dC5jb20AAA==
    #   -----END ECH KEYS-----
    # 如果填寫reality-config則開啟reality（注意不可與certificate和private-key同時填寫）
    reality-config:
      dest: test.com:443
      private-key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0 # 可由 mihomo generate reality-keypair 命令生成
      short-id:
        - 0123456789abcdef
      server-names:
        - test.com
      #下列兩個 limit 為選填，可對未透過驗證的回落連線限速，bytesPerSec 預設為 0 即不啟用
      #回落限速是一種特徵，不建議啟用，如果您是面板/一鍵指令碼開發者，務必讓這些引數隨機化
      limit-fallback-upload:
        after-bytes: 0 # 傳輸指定位元組後開始限速
        bytes-per-sec: 0 # 基準速率（位元組/秒）
        burst-bytes-per-sec: 0 # 突發速率（位元組/秒），大於 bytesPerSec 時生效
      limit-fallback-download:
        after-bytes: 0 # 傳輸指定位元組後開始限速
        bytes-per-sec: 0 # 基準速率（位元組/秒）
        burst-bytes-per-sec: 0 # 突發速率（位元組/秒），大於 bytesPerSec 時生效
    ### 注意，對於vless listener, 如果 "allow-insecure" 不為 true, 至少需要填寫 “certificate和private-key” 或 “reality-config” 或 “decryption” 的其中一項 ###
    # allow-insecure: false # 是否允許不開啟tls加密（注意：僅用於有 nginx, caddy 前置的情況）

  - name: anytls-in-1
    type: anytls
    port: 10818 # 支援使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    users:
      username1: password1
      username2: password2
    # "certificate" and "private-key" are required
    certificate: ./server.crt # 證書 PEM 格式，或者 證書的路徑
    private-key: ./server.key
    # 下面兩項為mTLS配置項，如果client-auth-type設定為 "verify-if-given" 或 "require-and-verify" 則client-auth-cert必須不為空
    # client-auth-type: "" # 可選值：""、"request"、"require-any"、"verify-if-given"、"require-and-verify"
    # client-auth-cert: string # 證書 PEM 格式，或者 證書的路徑
    # 如果填寫則開啟ech（可由 mihomo generate ech-keypair <明文域名> 生成）
    # ech-key: |
    #   -----BEGIN ECH KEYS-----
    #   ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
    #   madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
    #   dC5jb20AAA==
    #   -----END ECH KEYS-----
    ### 注意，anytls listener, 如果 "allow-insecure" 不為 true, 必須填寫 “certificate和private-key” ###
    # allow-insecure: false # 是否允許不開啟tls加密（注意：僅用於有 nginx, caddy 前置的情況）
    # padding-scheme: "" # https://github.com/anytls/anytls-go/blob/main/docs/protocol.md#cmdupdatepaddingscheme

  - name: mieru-in-1
    type: mieru
    port: 10818 # 支援使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    transport: TCP # 支援 TCP 或者 UDP
    users:
      username1: password1
      username2: password2
    # 一個 base64 字串用於微調網路行為
    # traffic-pattern: ""
    # 如果開啟，且客戶端不傳送使用者提示，代理伺服器將拒絕連線
    # user-hint-is-mandatory: false

  - name: sudoku-in-1
    type: sudoku
    port: 8443 # 僅支援單埠
    listen: 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    key: "<server_key>" # 如果你使用sudoku生成的ED25519金鑰對，此處是金鑰對中的公鑰，當然，你也可以僅僅使用任意uuid充當key
    aead-method: chacha20-poly1305 # 可選：chacha20-poly1305、aes-128-gcm、none（不建議；none 不提供 AEAD 保護）
    padding-min: 1 # 最小填充率（0-100）
    padding-max: 15 # 最大填充率（0-100，必須 >= padding-min）
    table-type: prefer_ascii # 可選值：prefer_ascii、prefer_entropy、up_ascii_down_entropy、up_entropy_down_ascii
    # custom-table: xpxvvpvv # 可選，自定義位元組佈局，必須包含2個x、2個p、4個v，可隨意組合；只對 entropy 方向生效
    # custom-tables: ["xpxvvpvv", "vxpvxvvp"] # 可選，自定義位元組佈局列表（x/v/p），用於多表輪換；非空時覆蓋 custom-table
    handshake-timeout: 5   # 可選（秒）
    enable-pure-downlink: false # 可選：false=頻寬最佳化下行；true=純 Sudoku 下行
    # 推薦：使用 httpmask 物件統一管理 HTTPMask 相關欄位：
    httpmask:
      disable: false # true 禁用所有 HTTP 偽裝/隧道
      mode: legacy # 可選：legacy（預設）、stream（split-stream）、poll、auto（先 stream 再 poll）、ws（WebSocket 隧道）
      # path-root: "" # 可選：HTTP 隧道端點一級路徑字首（雙方需一致），例如 "aabbcc" 或 "/aabbcc/" => /aabbcc/session、/aabbcc/stream、/aabbcc/api/v1/upload、/aabbcc/ws
    #
    # fallback: "127.0.0.1:80" # 可選：用於可連線請求的回落轉發，可與其他服務共埠



  - name: trojan-in-1
