  - name: "vless-encryption"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    # -------------------------
    # vless encryption客戶端配置：
    # （native/xorpub 的 XTLS Vision 可以 Splice。只使用 1-RTT 模式 / 若服務端發的 ticket 中秒數不為零則 0-RTT 複用）
    # / 是隻能選一個，後面 base64 至少一個，無限串聯，使用  mihomo generate vless-x25519 和 mihomo generate vless-mlkem768 生成，替換值時需去掉括號
    #
    # Padding 是可選的引數，僅作用於 1-RTT 以消除握手的長度特徵，雙端預設值均為 "100-111-1111.75-0-111.50-0-3333"：
    # 在 1-RTT client/server hello 後以 100% 的機率粘上隨機 111 到 1111 位元組的 padding
    # 以 75% 的機率等待隨機 0 到 111 毫秒（"probability-from-to"）
    # 再次以 50% 的機率傳送隨機 0 到 3333 位元組的 padding（若為 0 則不 Write()）
    # 服務端、客戶端可以設定不同的 padding 引數，按 len、gap 的順序無限串聯，第一個 padding 需機率 100%、至少 35 位元組
    # -------------------------
    encryption: "mlkem768x25519plus.native/xorpub/random.1rtt/0rtt.(padding len).(padding gap).(X25519 Password).(ML-KEM-768 Client)..."
    tls: false #可以不開啟tls
    udp: true

