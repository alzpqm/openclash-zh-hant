    #  bbr-profile: "" # Available: "standard", "conservative", "aggressive". Default: "standard"
    #  max-idle-time: 15000
    #  alpn:
    #    - h3
    #  ignore-client-bandwidth: false
    # HTTP3 伺服器認證失敗時的行為 （URL 字串配置）,如果 masquerade 未配置，則返回 404 頁
    #  masquerade: file:///var/www # 作為檔案伺服器
