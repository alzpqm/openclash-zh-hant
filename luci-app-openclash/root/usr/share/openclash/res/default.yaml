    server: vpn.example.com
    port: 1194
    proto: udp # udp/tcp，預設 udp
    # dev: tun # 目前僅支援 tun，預設 tun
    # cipher: AES-128-GCM # 支援 AES-128-GCM / AES-192-GCM / AES-256-GCM / AES-128-CBC / AES-192-CBC / AES-256-CBC / CHACHA20-POLY1305，預設 AES-128-GCM；AES-CBC 會按 AES-128-CBC 處理
    # auth: SHA256 # 支援 MD5 / SHA1 / SHA256 / SHA384 / SHA512，預設 SHA256；AEAD cipher 會忽略 auth
    # comp-lzo: "no" # 可選值："yes", "no", "adaptive"
    # username / password: auth-user-pass 模式（與下方 cert+key 二選一，不能都不填）
    # username: "user"
    # password: "pass"
    # 從 .ovpn 中複製 <ca></ca> 內的內容，不需要保留 <ca> 標籤
    ca: |
      -----BEGIN CERTIFICATE-----
      MIIB...example
      -----END CERTIFICATE-----
    # 從 .ovpn 中複製 <cert></cert> 內的內容（auth-user-pass 時可省略 cert / key）
    cert: |
      -----BEGIN CERTIFICATE-----
      MIIB...example
      -----END CERTIFICATE-----
    # 從 .ovpn 中複製 <key></key> 內的內容
    key: |
      -----BEGIN PRIVATE KEY-----
      MIIE...example
      -----END PRIVATE KEY-----
    # 從 .ovpn 中複製 <tls-crypt></tls-crypt> 內的內容，不需要保留 <tls-crypt> 標籤；沒有 tls-crypt 的配置可省略
    # tls-crypt: |
    #   -----BEGIN OpenVPN Static key V1-----
    #   00000000000000000000000000000000
    #   ...
    #   -----END OpenVPN Static key V1-----
    # peer-info: # 透傳給服務端的 peer-info 鍵值對，追加在內建 IV_VER/IV_PROTO/IV_CIPHERS 之後；用於服務端基於 peer-info 做准入決策
