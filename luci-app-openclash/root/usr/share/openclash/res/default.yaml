    #      - stun.sip.us:3478
    #      - global.stun.twilio.com:3478
    #    # proxy: DIRECT # 設定server-url透過哪個代理進行連線
    #    # 下面支援填寫針對server-url的TLS配置(sni, skip-cert-verify, fingerprint, certificate, private-key, alpn)
    #    # skip-cert-verify： false
    #    # ......

  # 注意，這是用於自建hysteria2入站和出站中realm-opts中server-url的HTTP/HTTPS伺服器，請勿混淆
  - name: hysteria2-realm-in-1
    type: hysteria2-realm
    port: 10820 # 支援使用ports格式，例如200,302 or 200,204,401-429,501-503
    listen: 0.0.0.0
    # routing-mark: 0 # 為監聽socket設定routing-mark（僅支援linux）
    token: public # hysteria2入站和出站透過 `Authorization: Bearer <token>` 出示的 Bearer 令牌。
    max-realms: 65536 # maximum total realms (0 = unlimited)
    max-realms-per-ip: 4 # maximum realms per client IP (0 = unlimited)
    trusted-proxy-header: "" # header to read real client IP from (e.g. X-Forwarded-For)
    realm-name-pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" # regex realm names must match
    # # 下面內容如果配置， realm 將透過 TLS 提供 HTTPS 服務；否則提供明文 HTTP
    # certificate: ./server.crt # 證書 PEM 格式，或者 證書的路徑
    # private-key: ./server.key # 證書對應的私鑰 PEM 格式，或者私鑰路徑
