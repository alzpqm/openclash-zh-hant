# 嗅探網域名稱 可選設定
sniffer:
  ## 對 redir-host 型別識別的流量進行強制嗅探
  ## 如：Tun、Redir 和 TProxy 並 DNS 為 redir-host 皆屬於
  force-dns-mapping: true
  ## 對所有未獲取到網域名稱的流量進行強制嗅探
  parse-pure-ip: true
  # 是否使用嗅探結果作為實際存取，預設 false
  # 全域性設定，優先順序低於 sniffer.sniff 實際設定
  override-destination: false
  sniff: # TLS 和 QUIC 預設如果不設定 ports 預設嗅探 443
    QUIC:
      ports: [ 443 ]

    TLS:
      ports: [443, 8443]

    # 預設嗅探 80
    HTTP:
      ports: [80, 8080-8880]
      # 是否使用嗅探結果作為實際存取
      override-destination: false
  force-domain:
#  - '+' # Force all domain to use sniffer
  - "+.netflix.com"
  - "+.nflxvideo.net"
  - "+.amazonaws.com"
  - "+.media.dssott.com"
  ## 對嗅探結果進行跳過
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - +.oray.com
  - +.sunlogin.net
  - +.push.apple.com
  #- geosite:cn
  # skip-src-address: # 對於來源ip跳過嗅探
  #   - 192.168.0.3/32
  # skip-dst-address: # 對於目標ip跳過嗅探
  #   - 192.168.0.3/32
